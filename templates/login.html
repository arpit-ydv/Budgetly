<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Budgetly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-md bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center gap-3 justify-center mb-6">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-black text-white text-lg">
        B
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Budgetly</h1>
    </div>

    <h2 class="text-lg font-semibold text-center text-slate-200 mb-2">Welcome Back</h2>
    <p class="text-xs text-center text-slate-400 mb-6">Enter your details to access your expense tracker</p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-lg text-xs font-medium {% if category == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Username</label>
        <input type="text" name="username" required autofocus placeholder="yourusername"
               class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
               class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>

      <button type="submit"
              class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-sm py-3 rounded-xl transition shadow-lg shadow-indigo-500/25 active:scale-[0.99] mt-2">
        Sign In
      </button>
    </form>

    <p class="text-xs text-center text-slate-500 mt-6">
      Don't have an account? 
      <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-semibold underline">Sign up</a>
    </p>
  </div>
</body>
</html>

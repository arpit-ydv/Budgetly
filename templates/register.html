<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgetly — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      background-color: #07090e;
    }
    .liquid-glass {
      background: radial-gradient(130% 130% at 0% 0%, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 100%),
                  rgba(15, 18, 28, 0.72);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55),
                  inset 0 1px 1px rgba(255, 255, 255, 0.25),
                  inset 0 -1px 1px rgba(0, 0, 0, 0.4);
    }
    .liquid-input {
      background: rgba(10, 13, 22, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-input:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.12);
      background: rgba(12, 16, 26, 0.9);
    }
    .liquid-button {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.95) 0%, rgba(14, 165, 233, 0.9) 100%);
      box-shadow: 0 12px 25px -4px rgba(56, 189, 248, 0.4),
                  inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px -4px rgba(56, 189, 248, 0.55),
                  inset 0 1px 1px rgba(255, 255, 255, 0.6);
      filter: brightness(1.08);
    }
    .liquid-button:active {
      transform: translateY(0.5px);
      filter: brightness(0.96);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-sky-400 selection:text-slate-950">

  <!-- Specular Ambient Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -right-32 w-[30rem] h-[30rem] bg-indigo-500/20 rounded-full blur-[140px]"></div>
    <div class="absolute -bottom-32 -left-32 w-[32rem] h-[32rem] bg-sky-400/18 rounded-full blur-[140px]"></div>
  </div>

  <div class="relative z-10 w-full max-w-md">
    <div class="liquid-glass rounded-3xl p-8 sm:p-10 space-y-6">
      
      <!-- Brand & Title -->
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
          Budgetly
          <span class="text-[10px] uppercase font-mono tracking-widest px-2.5 py-0.5 rounded-full bg-white/[0.06] text-sky-300 border border-white/[0.12]">Liquid</span>
        </h1>
        <p class="text-xs text-slate-400">Initialize your personal expense workspace</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="p-3 rounded-2xl text-xs font-medium border backdrop-blur-md {% if category == 'error' %}bg-rose-500/15 border-rose-500/30 text-rose-300{% else %}bg-emerald-500/15 border-emerald-500/30 text-emerald-300{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- Form -->
      <form action="/register" method="POST" class="space-y-4">
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Choose Username</label>
          <input type="text" name="username" placeholder="e.g. arpit" required autocomplete="username"
                 class="w-full liquid-input rounded-2xl px-4 py-2.5 text-sm text-white placeholder-slate-500">
        </div>

        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Create Password</label>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="new-password"
                 class="w-full liquid-input rounded-2xl px-4 py-2.5 text-sm text-white placeholder-slate-500">
        </div>

        <button type="submit" class="w-full liquid-button text-white font-bold text-sm py-3 rounded-2xl mt-2">
          Create Account
        </button>
      </form>

      <!-- Footer Link -->
      <div class="pt-2 text-center text-xs text-slate-400">
        Already registered? 
        <a href="/login" class="text-sky-300 hover:text-sky-200 font-semibold transition hover:underline">
          Sign In
        </a>
      </div>

    </div>
  </div>

</body>
</html>
